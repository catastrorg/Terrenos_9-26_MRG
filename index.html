<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <!-- Permite que el mapa se adapte correctamente a celulares -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mapa de Parcelas</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>

    /* Eliminar márgenes de la página */
    body {
      margin: 0;
      padding: 0;
    }

    /* El mapa ocupa toda la pantalla */
    #map {
      width: 100%;
      height: 100vh;
    }

  </style>
</head>


<body>

  <!-- Contenedor del mapa -->
  <div id="map"></div>


  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <script>

    // ============================================
    // CREAR EL MAPA
    // ============================================

    const map = L.map('map');


    // ============================================
    // AGREGAR MAPA BASE
    // ============================================

    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 22,
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);


    // ============================================
    // CARGAR EL ARCHIVO GEOJSON
    // ============================================

    fetch('acto_8-9-26.geojson')

      .then(response => {

        // Verificar si el archivo fue encontrado
        if (!response.ok) {
          throw new Error(
            'No se pudo cargar el archivo GeoJSON'
          );
        }

        return response.json();
      })


      .then(data => {

        // Crear la capa de parcelas
        const parcelas = L.geoJSON(data, {

          // Estilo de las parcelas
          style: {
            color: '#ff6600',
            weight: 2,
            fillColor: '#ff9900',
            fillOpacity: 0.4
          },


          // Configuración individual
          // para cada elemento del GeoJSON
          onEachFeature: function(feature, layer) {

            // Verificar si existen atributos
            if (feature.properties) {

              let contenido = '';

              // Recorrer todos los atributos
              for (let propiedad in feature.properties) {

                contenido +=
                  '<b>' + propiedad + ':</b> ' +
                  feature.properties[propiedad] +
                  '<br>';

              }


              // Crear ventana emergente
              layer.bindPopup(contenido);

            }

          }

        }).addTo(map);


        // ============================================
        // CENTRAR EL MAPA AUTOMÁTICAMENTE
        // ============================================

        if (parcelas.getBounds().isValid()) {

          map.fitBounds(
            parcelas.getBounds(),
            {
              padding: [30, 30]
            }
          );

        }

      })


      // ============================================
      // MOSTRAR ERRORES EN LA CONSOLA
      // ============================================

      .catch(error => {

        console.error(
          'Error al cargar el GeoJSON:',
          error
        );

        alert(
          'No se pudo cargar el archivo acto_8-9-26.geojson'
        );

      });


  </script>

</body>
</html>
